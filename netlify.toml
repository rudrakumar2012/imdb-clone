[build]
  command = "npm run build"
  publish = ".next/standalone"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = ".next/standalone/.netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/__next"
  status = 200

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
